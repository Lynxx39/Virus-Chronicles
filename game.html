<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <link rel="manifest" href="manifest.json">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="css/game.css">
        <link rel="stylesheet" type="text/css" href="css/xvpedition.css">
        <title>Virus Chronicles</title>
    </head>
    <body style="background-color: black">
        <!-- GLOSARIUM & REFERENSI POPUP -->
        <div class="popup-overlay" id="xvpeditionPopup">
            <div class="popup xvpedition">
                <div class="close-btn" onclick="closeXVpedition()">✕</div>
                
                <div class="xvpedition-header">
                    <h2 class="xvpedition-main-title" id="xvMainTitle">📖 Glosarium Virus</h2>
                </div>

                <!-- 1. GLOSARIUM VIEW -->
                <div id="xvViewGlosarium" class="xv-tab-view" style="display:none;">
                    <div class="xvpedition-controls">
                        <input type="text" id="xvSearchInput" class="xvpedition-search" placeholder="🔍 Cari istilah biologi (contoh: Litik, Kapsid, Vaksin)..." oninput="filterXVpedition()">
                        <div class="xvpedition-cats" id="xvCategories">
                            <button class="cat-btn active" onclick="setXVCategory('all', this)">Semua</button>
                            <button class="cat-btn" onclick="setXVCategory('struktur', this)">Struktur & Ciri</button>
                            <button class="cat-btn" onclick="setXVCategory('replikasi', this)">Replikasi</button>
                            <button class="cat-btn" onclick="setXVCategory('penyakit', this)">Penyakit</button>
                            <button class="cat-btn" onclick="setXVCategory('pencegahan', this)">Manfaat & Pencegahan</button>
                        </div>
                    </div>

                    <div class="xvpedition-content" id="xvpeditionList">
                        <!-- Glosarium items populated by JavaScript -->
                    </div>
                </div>

                <!-- 3. REFERENSI WEB VIEW (SLIDER WITH NAV BUTTONS) -->
                <div id="xvViewReferensi" class="xv-tab-view" style="display:none;">
                    <!-- Content populated by JavaScript renderReferensi() -->
                </div>
            </div>
        </div>

        <script type="text/javascript" src="js/xvpedition.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
