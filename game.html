<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <link rel="manifest" href="manifest.json">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="css/game.css">
        <link rel="stylesheet" type="text/css" href="css/xvpedition.css">
        <title>Virus Chronicles</title>
        <script type="module" src="js/libs/model-viewer.min.js"></script>
    </head>
    <body style="background-color: black">
        <!-- VXPEDITION POPUP -->
        <div class="popup-overlay" id="xvpeditionPopup">
            <div class="popup xvpedition">
                <div class="close-btn" onclick="closeXVpedition()">✕</div>
                <div class="xvpedition-header">
                    <h2 class="xvpedition-main-title">VXPEDITION</h2>
                    <div class="xvpedition-nav-tabs">
                        <button class="xv-tab-btn active" id="xvTabGlosarium" onclick="switchXVTab('glosarium')">📖 Glosarium</button>
                        <button class="xv-tab-btn" id="xvTabStruktur" onclick="switchXVTab('struktur')">🧬 Struktur Virus (3D)</button>
                    </div>
                </div>

                <!-- TAB 1: GLOSARIUM -->
                <div id="xvViewGlosarium" class="xv-tab-view active">
                    <div class="xvpedition-controls">
                        <input type="text" id="xvSearchInput" class="xvpedition-search" placeholder="🔍 Cari istilah biologi (contoh: Litik, Kapsid, Vaksin)..." oninput="filterXVpedition()">
                        <div class="xvpedition-cats" id="xvCategories">
                            <button class="cat-btn active" onclick="setXVCategory('all', this)">Semua</button>
                            <button class="cat-btn" onclick="setXVCategory('struktur', this)">Struktur & Ciri</button>
                            <button class="cat-btn" onclick="setXVCategory('replikasi', this)">Replikasi</button>
                            <button class="cat-btn" onclick="setXVCategory('penyakit', this)">Penyakit</button>
                            <button class="cat-btn" onclick="setXVCategory('pencegahan', this)">Manfaat & Pencegahan</button>
                        </div>
                    </div>

                    <div class="xvpedition-content" id="xvpeditionList">
                        <!-- Glosarium items populated by JavaScript -->
                    </div>
                </div>

                <!-- TAB 2: STRUKTUR VIRUS 3D -->
                <div id="xvViewStruktur" class="xv-tab-view" style="display:none;">
                    <div class="xv-model-layout">
                        <div class="xv-model-container">
                            <div class="model-controls-bar">
                                <button class="model-ctrl-btn" onclick="toggleModelAutoRotate()">🔄 Putar</button>
                                <button class="model-ctrl-btn" onclick="resetModelCamera()">🔍 Reset</button>
                            </div>
                            <model-viewer id="virusModelViewer"
                                src="virus_bacteriofage.glb"
                                alt="Model 3D Struktur Virus Bakteriofag"
                                auto-rotate
                                camera-controls
                                shadow-intensity="1.5"
                                exposure="1.1"
                                touch-action="pan-y"
                                style="width: 100%; height: 100%;">
                            </model-viewer>
                            <div class="model-overlay-hint">
                                <span>👆 Geser untuk memutar 3D | 🔍 Scroll/Cubit untuk Zoom</span>
                            </div>
                        </div>

                        <div class="xv-model-info-panel">
                            <h3 class="xv-info-title">🔬 Struktur Anatomi Bakteriofag</h3>
                            <div class="xv-parts-list" id="xvPartsList">
                                <!-- Structure parts populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script type="text/javascript" src="js/xvpedition.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
    </body>
</html>
